<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Workers</title>

    <link rel="stylesheet" href="manage-workers.css">
</head>

<body>

<div class="header">

    <h1>👷 Manage Workers</h1>

    <button onclick="goAdmin()">
        ⬅ Back to Admin
    </button>

</div>

<div class="container">

    <div class="form-card">

        <h2>Add Worker</h2>

        <input type="text" id="workerName" placeholder="Worker Name">

        <input type="email" id="workerEmail" placeholder="Worker Email">

        <input type="password" id="workerPassword" placeholder="Password">

        <select id="workerSpecialty">
            <option value="">Select Specialty</option>
            <option>Cleaning</option>
            <option>Plumbing</option>
            <option>Electrical</option>
            <option>Gardening</option>
            <option>Painting</option>
            <option>Appliance Repair</option>
            <option>Aircon Cleaning</option>
            <option>Carpentry</option>
        </select>

        <select id="workerAvailability">
            <option>Available</option>
            <option>Busy</option>
            <option>On Leave</option>
        </select>

        <button onclick="addWorker()">
            ➕ Add Worker
        </button>

    </div>

    <div>

        <h2>Worker List</h2>

        <div id="workerList"></div>

    </div>

</div>

<script src="manage-workers.js"></script>

</body>
</html>
